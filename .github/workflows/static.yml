# Build the Vite app and publish the generated /docs folder to GitHub Pages.
name: Build and deploy Telegram Mini App

on:
    push:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: npm

            - name: Create env file
              run: |
                  touch .env
                  echo VITE_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_KEY }} >> .env
                  echo VITE_BRIDGE_URL=${{ secrets.BRIDGE_URL }} >> .env

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # GitHub Pages is currently configured to publish the main branch /docs folder.
            # Keep the generated Vite output in that folder so branch-based Pages serves the built app.
            - name: Commit generated docs
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add docs
                  git diff --cached --quiet || git commit -m "chore: update GitHub Pages build [skip ci]"
                  git push

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: './docs'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
